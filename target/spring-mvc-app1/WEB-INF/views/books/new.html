<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="ISO-8859-1">
    <title>All people</title>
</head>

<body>

<form th:method="POST" th:action="@{/books}" th:object="${book}">

    <label for="title">Enter title of book</label>
    <input type="text" th:field="*{title}" id="title">

    <label for="author">Enter author of the book</label>
    <input type="text" th:field="*{author}" id="author">

    <label for="year">Enter year of publish</label>
    <input type="text" th:field="*{year}" id="year">

    <input type="submit" value="Create!">

</form>
</body>

</html>
