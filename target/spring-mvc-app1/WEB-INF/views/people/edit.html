<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="ISO-8859-1">
    <title>Update person</title>
</head>

<body>

<form th:method="PATCH" th:action="@{/people/{id}(id=${person.getId()})}" th:object="${person}">

    <label for="name">Edit your name</label>
    <input type="text" th:field="*{fullName}" id="name">
    <br/>

    <label for="age">Edit your age</label>
    <input type="text" th:field="*{birthYear}" id="age">
    <br/>

    <input type="submit" value="Update!">

</form>
</body>

</html>
