<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edycja czytelnika</title>
    <!-- Korzystamy z tego samego pliku co książki -->
    <link rel="stylesheet" th:href="@{/css/books/books.css}">
</head>
<body>

<div class="container">
    <h1>Edytuj dane czytelnika</h1>

    <form th:method="PATCH" th:action="@{/people/{id}(id=${person.getId()})}" th:object="${person}">

        <div class="form-group">
            <label for="name">Imię i nazwisko</label>
            <input type="text" th:field="*{fullName}" id="name">
            <!-- Klasa error-msg zamiast stylu style="color:red" -->
            <div class="error-msg"
                 th:if="${#fields.hasErrors('fullName')}"
                 th:errors="*{fullName}">Błąd imienia</div>
        </div>

        <div class="form-group">
            <label for="age">Rok urodzenia</label>
            <input type="number" th:field="*{birthYear}" id="age">
            <div class="error-msg"
                 th:if="${#fields.hasErrors('birthYear')}"
                 th:errors="*{birthYear}">Błąd roku urodzenia</div>
        </div>

        <div class="actions">
            <!-- Zielony/Szary przycisk akcji -->
            <input type="submit" value="Zaktualizuj" class="btn-submit">
            <!-- Link powrotu -->
            <a th:href="@{/people/{id}(id=${person.getId()})}" class="btn-back">Anuluj</a>
        </div>

    </form>
</div>

</body>
</html>
