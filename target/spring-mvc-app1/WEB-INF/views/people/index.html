<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista osób</title>
    <!-- Na razie ścieżka do books.css, póki nie zmienisz nazwy pliku -->
    <link rel="stylesheet" th:href="@{/css/books/books.css}">
</head>
<body>

<div class="container">
    <h1>Lista czytelników</h1>

    <div class="book-list">
        <!-- Każda osoba jako element listy -->
        <div th:each="person : ${people}" class="book-item">
            <a class="book-link"
               th:href="@{/people/{id}(id=${person.getId()})}"
               th:text="${person.getFullName()}">Imię i Nazwisko</a>
        </div>
    </div>

    <hr/>

    <div class="actions">
        <!-- Przycisk dodawania nowej osoby -->
        <a href="/people/new" class="btn-add">Dodaj nową osobę</a>
    </div>
</div>

</body>
</html>
