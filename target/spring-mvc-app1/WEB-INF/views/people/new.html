<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"> <title>New person</title>
</head>
<body>

<form th:method="POST" th:action="@{/people}" th:object="${person}">

    <label for="name">Enter your name</label>
    <input type="text" th:field="*{fullName}" id="name">
    <div style="color:red" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Name error</div>

    <br/>

    <label for="age">Enter your birth year</label>
    <input type="text" th:field="*{birthYear}" id="age">
    <div style="color:red" th:if="${#fields.hasErrors('birthYear')}" th:errors="*{birthYear}">BirthYear error</div>

    <br/>
    <input type="submit" value="Create!">

</form>

</body>
</html>
