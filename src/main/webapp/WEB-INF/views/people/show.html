<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Profil czytelnika</title>
    <!-- Korzystamy z tego samego pliku CSS -->
    <link rel="stylesheet" th:href="@{/css/books/books.css}">
</head>
<body>

<div class="container">
    <div class="card">
        <!-- Nagłówek z imieniem -->
        <h1 th:text="${person.fullName}">Imię i nazwisko</h1>

        <div class="info-section">
            <p><strong>Rok urodzenia:</strong> <span th:text="${person.birthYear}">1990</span></p>
        </div>

        <hr/>

        <!-- Sekcja KSIĄŻEK -->
        <div class="status-section">
            <h3>Wypożyczone książki:</h3>

            <!-- Jeśli lista jest pusta -->
            <div th:if="${books.isEmpty()}">
                <p class="msg-muted">Ta osoba nie posiada obecnie żadnych książek.</p>
            </div>

            <!-- Jeśli osoba ma wypożyczone książki -->
            <div th:unless="${books.isEmpty()}">
                <ul class="book-list-simple">
                    <li th:each="book : ${books}" class="book-item-simple">
                        <span th:text="${book.title + ', ' + book.author + ', ' + book.year}">Tytuł</span>
                    </li>
                </ul>
            </div>
        </div>

        <hr/>

        <!-- Sekcja AKCJI -->
        <div class="actions">
            <!-- Niebieski/Stalowy przycisk Edytuj -->
            <a th:href="@{/people/{id}/edit(id=${person.id})}" class="btn-edit">Edytuj dane</a>

            <!-- Jasnoszary przycisk Usuń -->
            <form th:method="DELETE" th:action="@{/people/{id}(id=${person.id})}">
                <input type="submit" value="Usuń osobę" class="btn-danger"/>
            </form>
        </div>

        <div class="footer-link">
            <a href="/people" class="btn-back">← Powrót do listy osób</a>
        </div>
    </div>
</div>

</body>
</html>
