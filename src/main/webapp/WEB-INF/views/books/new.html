<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dodaj nową książkę</title>
    <link rel="stylesheet" th:href="@{/css/books/books.css}">
</head>
<body>

<div class="container">
    <h1>Dodaj nową książkę</h1>

    <form th:method="POST" th:action="@{/books}" th:object="${book}" class="form-container">

        <div class="form-group">
            <label for="title">Tytuł książki</label>
            <input type="text" th:field="*{title}" id="title" placeholder="Wpisz tytuł...">
            <div class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Błąd tytułu</div>
        </div>

        <div class="form-group">
            <label for="author">Autor książki</label>
            <input type="text" th:field="*{author}" id="author" placeholder="Imię i nazwisko...">
            <div class="error-msg" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">Błąd autora</div>
        </div>

        <div class="form-group">
            <label for="year">Rok wydania</label>
            <input type="number" th:field="*{year}" id="year" placeholder="np. 1990">
            <div class="error-msg" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">Błąd roku</div>
        </div>

        <div class="actions">
            <input type="submit" value="Utwórz książkę" class="btn-submit">
            <a href="/books" class="btn-back">Powrót do listy</a>
        </div>

    </form>
</div>

</body>
</html>
