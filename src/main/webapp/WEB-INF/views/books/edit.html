<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edycja książki</title>
    <!-- Używamy tego samego pliku CSS -->
    <link rel="stylesheet" th:href="@{/css/books/books.css}">
</head>
<body>

<div class="container">
    <h1>Edytuj dane książki</h1>

    <!-- Pamiętaj o th:method="PATCH" - Spring potrzebuje HiddenHttpMethodFilter, żeby to działało -->
    <form th:method="PATCH" th:action="@{/books/{id}(id=${book.getId()})}" th:object="${book}" class="form-container">

        <div class="form-group">
            <label for="title">Tytuł książki</label>
            <input type="text" th:field="*{title}" id="title">
            <div class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Błąd tytułu</div>
        </div>

        <div class="form-group">
            <label for="author">Autor książki</label>
            <input type="text" th:field="*{author}" id="author">
            <div class="error-msg" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">Błąd autora</div>
        </div>

        <div class="form-group">
            <label for="year">Rok wydania</label>
            <input type="number" th:field="*{year}" id="year">
            <div class="error-msg" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">Błąd roku</div>
        </div>

        <div class="actions">
            <input type="submit" value="Zaktualizuj" class="btn-submit">
            <a th:href="@{/books/{id}(id=${book.getId()})}" class="btn-back">Anuluj</a>
        </div>

    </form>
</div>

</body>
</html>
